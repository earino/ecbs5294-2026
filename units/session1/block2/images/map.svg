<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="300" viewBox="0 0 1180 300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#1f2328">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs>
<rect width="1180" height="300" fill="#ffffff"/>
<rect x="20" y="96" width="156" height="58" rx="9" fill="#eef3f8" stroke="#9fb3c8" stroke-width="2"/>
<text x="98.0" y="133" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="21" font-weight="700" fill="#1f2328">FROM</text>
<text x="98.0" y="182" text-anchor="middle" font-size="18" fill="#57606a">the table</text>
<line x1="180" y1="125.0" x2="210" y2="125.0" stroke="#57606a" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="216" y="96" width="156" height="58" rx="9" fill="#eef3f8" stroke="#9fb3c8" stroke-width="2"/>
<text x="294.0" y="133" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="21" font-weight="700" fill="#1f2328">WHERE</text>
<text x="294.0" y="182" text-anchor="middle" font-size="18" fill="#57606a">keeps rows</text>
<line x1="376" y1="125.0" x2="406" y2="125.0" stroke="#57606a" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="412" y="96" width="156" height="58" rx="9" fill="#eef3f8" stroke="#9fb3c8" stroke-width="2"/>
<text x="490.0" y="133" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="21" font-weight="700" fill="#1f2328">GROUP BY</text>
<text x="490.0" y="182" text-anchor="middle" font-size="18" fill="#57606a">rows → groups</text>
<line x1="572" y1="125.0" x2="602" y2="125.0" stroke="#57606a" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="608" y="96" width="156" height="58" rx="9" fill="#eef3f8" stroke="#9fb3c8" stroke-width="2"/>
<text x="686.0" y="133" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="21" font-weight="700" fill="#1f2328">SELECT</text>
<text x="686.0" y="182" text-anchor="middle" font-size="18" fill="#57606a">computes columns</text>
<line x1="768" y1="125.0" x2="798" y2="125.0" stroke="#57606a" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="804" y="96" width="156" height="58" rx="9" fill="#eef3f8" stroke="#9fb3c8" stroke-width="2"/>
<text x="882.0" y="133" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="21" font-weight="700" fill="#1f2328">ORDER BY</text>
<text x="882.0" y="182" text-anchor="middle" font-size="18" fill="#57606a">sorts</text>
<line x1="964" y1="125.0" x2="994" y2="125.0" stroke="#57606a" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="1000" y="96" width="156" height="58" rx="9" fill="#eef3f8" stroke="#9fb3c8" stroke-width="2"/>
<text x="1078.0" y="133" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="21" font-weight="700" fill="#1f2328">LIMIT</text>
<text x="1078.0" y="182" text-anchor="middle" font-size="18" fill="#57606a">cuts</text>
<text x="20" y="28" font-size="20" font-weight="700" fill="#1f2328">The order it runs</text>
<text x="20" y="256" font-size="18" fill="#57606a">The order you write it: <tspan font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace">SELECT · FROM · WHERE · GROUP BY · ORDER BY · LIMIT</tspan></text>
<text x="20" y="286" font-size="18" font-style="italic" fill="#1f2328">Each clause gets the result of the one before it. Nothing can use what has not been made yet.</text>
</svg>
