<text x="88.0" y="133" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="21" font-weight="700" fill="#1f2328">FROM</text>
<text x="88.0" y="182" text-anchor="middle" font-size="18" fill="#57606a">the table</text>
<line x1="160" y1="125.0" x2="184" y2="125.0" stroke="#57606a" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="190" y="96" width="136" height="58" rx="9" fill="#bc4c00" stroke="#bc4c00" stroke-width="2"/>
<text x="258.0" y="133" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="21" font-weight="700" fill="#ffffff">WHERE</text>
<text x="258.0" y="182" text-anchor="middle" font-size="18" fill="#57606a">keeps rows</text>
<text x="258.0" y="62" text-anchor="middle" font-size="19" font-weight="700" fill="#bc4c00">one row at a time</text>
<path d="M249.0,74 L267.0,74 L258.0,88 z" fill="#bc4c00"/>
<line x1="330" y1="125.0" x2="354" y2="125.0" stroke="#57606a" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="360" y="96" width="136" height="58" rx="9" fill="#eef3f8" stroke="#9fb3c8" stroke-width="2"/>
<text x="428.0" y="133" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="21" font-weight="700" fill="#1f2328">GROUP BY</text>
<text x="428.0" y="182" text-anchor="middle" font-size="18" fill="#57606a">rows → groups</text>
<line x1="500" y1="125.0" x2="524" y2="125.0" stroke="#57606a" stroke-width="2.5" marker-end="url(#ah)"/>
