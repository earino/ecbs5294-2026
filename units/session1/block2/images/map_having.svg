<text x="598.0" y="133" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="21" font-weight="700" fill="#ffffff">HAVING</text>
<text x="598.0" y="182" text-anchor="middle" font-size="18" fill="#57606a">keeps groups</text>
<text x="598.0" y="62" text-anchor="middle" font-size="19" font-weight="700" fill="#0969da">one group at a time</text>
<path d="M589.0,74 L607.0,74 L598.0,88 z" fill="#0969da"/>
<line x1="670" y1="125.0" x2="694" y2="125.0" stroke="#57606a" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="700" y="96" width="136" height="58" rx="9" fill="#eef3f8" stroke="#9fb3c8" stroke-width="2"/>
<text x="768.0" y="133" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="21" font-weight="700" fill="#1f2328">SELECT</text>
<text x="768.0" y="182" text-anchor="middle" font-size="18" fill="#57606a">computes columns</text>
<line x1="840" y1="125.0" x2="864" y2="125.0" stroke="#57606a" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="870" y="96" width="136" height="58" rx="9" fill="#eef3f8" stroke="#9fb3c8" stroke-width="2"/>
<text x="938.0" y="133" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="21" font-weight="700" fill="#1f2328">ORDER BY</text>
<text x="938.0" y="182" text-anchor="middle" font-size="18" fill="#57606a">sorts</text>
<line x1="1010" y1="125.0" x2="1034" y2="125.0" stroke="#57606a" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="1040" y="96" width="136" height="58" rx="9" fill="#eef3f8" stroke="#9fb3c8" stroke-width="2"/>
<text x="1108.0" y="133" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="21" font-weight="700" fill="#1f2328">LIMIT</text>
<text x="1108.0" y="182" text-anchor="middle" font-size="18" fill="#57606a">cuts</text>
<text x="20" y="28" font-size="20" font-weight="700" fill="#1f2328">The order it runs</text>
<text x="20" y="256" font-size="18" fill="#57606a">The order you write it: <tspan font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace">SELECT · FROM · WHERE · GROUP BY · HAVING · ORDER BY · LIMIT</tspan></text>
<text x="20" y="286" font-size="18" font-style="italic" fill="#1f2328">A condition on a count or a sum can only be tested once the groups exist: HAVING.</text>
</svg>
